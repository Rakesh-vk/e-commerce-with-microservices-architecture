spring.application.name=OrderService

# Application
server.port=8083
product-service.base-url=http://localhost:8082
payment-service.base-url= http://localhost:8084

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (used by JwtTokenProvider)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

management.endpoints.access.default=unrestricted
management.endpoints.web.exposure.include=health,info,configprops,mappings

# logging
logging.level.root=DEBUG
logging.file.name=OrderService.log
logging.config=classpath:logback-spring.xml

