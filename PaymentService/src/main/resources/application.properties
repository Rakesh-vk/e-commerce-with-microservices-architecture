spring.application.name=PaymentService

# Application
server.port=8084

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/paymentdb
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (used by JwtTokenProvider)
#jwt.secret=${JWT_SECRET}
#jwt.expiration-ms=86400000

management.endpoints.access.default=unrestricted
management.endpoints.web.exposure.include=health,info,configprops,mappings

# logging
logging.level.root=DEBUG
logging.file.name=PaymentService.log
logging.config=classpath:logback-spring.xml

#eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

#kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.OrderService.event

jwt.secret=test-secret-key-for-unit-tests-only-not-for-production-use-123456
jwt.expiration-ms=3600000